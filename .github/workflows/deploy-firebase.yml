# Auto-deploy the public frontend to Firebase Hosting on every push to main.
#
# Uses the OFFICIAL Firebase hosting deploy action with a service account key.
# The service account JSON is stored as a GitHub secret (FIREBASE_SERVICE_ACCOUNT)
# — it is NEVER committed to the repo.
#
# Setup (one-time):
# 1. Generate a service account key in Firebase console:
#    Project Settings → Service accounts → Generate new private key → download JSON
# 2. Add the ENTIRE JSON as a GitHub repo secret named FIREBASE_SERVICE_ACCOUNT:
#    GitHub → Settings → Secrets and variables → Actions → New repository secret
# 3. Push to main — the workflow runs automatically.

name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build static site for Firebase
        run: npm run build:firebase
        env:
          BUILD_TARGET: firebase
          NEXT_PUBLIC_API_BASE_URL: https://gadget-doctor-east-kilbride.onrender.com

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0.9.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: gadgetdoctorls
          channelId: live
