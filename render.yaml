services:
  - type: web
    name: gadget-doctor
    runtime: node
    plan: free # PostgreSQL is external (Supabase), so free tier works fine
    region: frankfurt # closest to UK; change if needed
    buildCommand: npm install --legacy-peer-deps --ignore-scripts && npm install nodemailer@6 --legacy-peer-deps --ignore-scripts && npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # paste your Supabase PostgreSQL URL in Render's dashboard
      # Uncomment to configure SMTP email
      # - key: SMTP_HOST
      #   value: smtp.gmail.com
      # - key: SMTP_PORT
      #   value: "587"
      # - key: SMTP_USER
      #   sync: false
      # - key: SMTP_PASS
      #   sync: false
      # - key: SMTP_FROM_EMAIL
      #   sync: false
      # - key: SMTP_FROM_NAME
      #   value: Gadget Doctor East Kilbride
